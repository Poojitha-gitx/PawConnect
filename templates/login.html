{% extends "base.html" %}

{% block title %}Log In – PawConnect{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; font-size: 2.5rem; margin-bottom: 10px;">🐾</div>
      <h2>Welcome Back</h2>
      <p class="auth-sub">Log in to manage your pets, submit adoptions, or review applications.</p>

      <!-- Quick Demo Login Helpers -->
      <div style="background-color: var(--bg-surface); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px;">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--heading-brown); text-transform: uppercase; margin-bottom: 8px;">
          ⚡ Quick Demo Accounts
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('pooja@example.com')">
            Adopter
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('hopeforpaws@shelter.org')">
            Shelter
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillLogin('admin@pawconnect.org')">
            Admin
          </button>
        </div>
      </div>

      <form action="{{ url_for('login') }}" method="POST" id="loginForm">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

        <div class="form-group" style="margin-bottom: 16px;">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password">Password</label>
          </div>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitLoginBtn">
          Sign In &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? 
        <a href="{{ url_for('register') }}">Register here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillLogin(email, pass) {
  document.getElementById('email').value = email;
  if (pass) {
    document.getElementById('password').value = pass;
  } else {
    document.getElementById('password').focus();
  }
}
</script>
{% endblock %}
