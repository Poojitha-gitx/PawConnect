{% extends "base.html" %}

{% block title %}Edit {{ pet.name }} – PawConnect{% endblock %}

{% block content %}
<div class="container" style="padding-top: 36px; padding-bottom: 70px;">
  <div style="max-width: 820px; margin: 0 auto;">
    
    <div style="margin-bottom: 24px;">
      <a href="{{ url_for('shelter_dashboard') }}" style="color: var(--text-muted); font-size: 0.9rem;">
        &larr; Back to Shelter Dashboard
      </a>
      <h1 style="font-size: 2.3rem; margin-top: 10px; color: var(--heading-brown);">
        Edit Profile: {{ pet.name }}
      </h1>
      <p style="color: var(--text-muted);">
        Update medical milestones, adoption availability, or description.
      </p>
    </div>

    <div style="background-color: var(--bg-card); padding: 36px; border-radius: var(--radius-xl); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
      <form action="{{ url_for('edit_pet', pet_id=pet.id) }}" method="POST">
        
        <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 16px; margin-bottom: 18px;">
          <div class="form-group">
            <label for="name">Pet's Name *</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ pet.name }}" required>
          </div>

          <div class="form-group">
            <label for="species">Species *</label>
            <select id="species" name="species" class="form-control" required>
              <option value="Dog" {% if pet.species == 'Dog' %}selected{% endif %}>Dog 🐶</option>
              <option value="Cat" {% if pet.species == 'Cat' %}selected{% endif %}>Cat 🐱</option>
              <option value="Rabbit" {% if pet.species == 'Rabbit' %}selected{% endif %}>Rabbit 🐰</option>
              <option value="Bird" {% if pet.species == 'Bird' %}selected{% endif %}>Bird 🦜</option>
              <option value="Other" {% if pet.species == 'Other' %}selected{% endif %}>Other 🐾</option>
            </select>
          </div>

          <div class="form-group">
            <label for="gender">Gender *</label>
            <select id="gender" name="gender" class="form-control" required>
              <option value="Male" {% if pet.gender == 'Male' %}selected{% endif %}>Male ♂</option>
              <option value="Female" {% if pet.gender == 'Female' %}selected{% endif %}>Female ♀</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 16px; margin-bottom: 18px;">
          <div class="form-group">
            <label for="breed">Breed / Mixture *</label>
            <input type="text" id="breed" name="breed" class="form-control" value="{{ pet.breed }}" required>
          </div>

          <div class="form-group">
            <label for="age_years">Age (Years)</label>
            <input type="number" id="age_years" name="age_years" class="form-control" value="{{ pet.age_years }}" min="0" max="30" required>
          </div>

          <div class="form-group">
            <label for="age_months">Age (Months)</label>
            <input type="number" id="age_months" name="age_months" class="form-control" value="{{ pet.age_months }}" min="0" max="11" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 16px; margin-bottom: 24px;">
          <div class="form-group">
            <label for="size">Estimated Size *</label>
            <select id="size" name="size" class="form-control" required>
              <option value="Small" {% if pet.size == 'Small' %}selected{% endif %}>Small (under 10 kg)</option>
              <option value="Medium" {% if pet.size == 'Medium' %}selected{% endif %}>Medium (10 - 25 kg)</option>
              <option value="Large" {% if pet.size == 'Large' %}selected{% endif %}>Large (25 - 45 kg)</option>
              <option value="Extra Large" {% if pet.size == 'Extra Large' %}selected{% endif %}>Extra Large (45+ kg)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="color">Color</label>
            <input type="text" id="color" name="color" class="form-control" value="{{ pet.color or '' }}">
          </div>

          <div class="form-group">
            <label for="status">Adoption Status *</label>
            <select id="status" name="status" class="form-control" required>
              <option value="Available" {% if pet.status == 'Available' %}selected{% endif %}>Available</option>
              <option value="Pending" {% if pet.status == 'Pending' %}selected{% endif %}>Pending Application</option>
              <option value="Adopted" {% if pet.status == 'Adopted' %}selected{% endif %}>Adopted</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label for="image_url">Photo URL *</label>
          <input type="url" id="image_url" name="image_url" class="form-control" value="{{ pet.image_url }}" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="description">Biography & Story *</label>
          <textarea id="description" name="description" class="form-control" rows="4" required>{{ pet.description }}</textarea>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; background: var(--bg-surface); padding: 18px; border-radius: var(--radius-md); margin-bottom: 20px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;">
            <input type="checkbox" name="vaccinated" value="1" {% if pet.vaccinated %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary-orange);">
            <span>💉 Vaccinated</span>
          </label>

          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;">
            <input type="checkbox" name="spayed_neutered" value="1" {% if pet.spayed_neutered %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary-orange);">
            <span>✂️ Spayed / Neutered</span>
          </label>

          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;">
            <input type="checkbox" name="good_with_kids" value="1" {% if pet.good_with_kids %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary-orange);">
            <span>👶 Good with Kids</span>
          </label>

          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600;">
            <input type="checkbox" name="good_with_pets" value="1" {% if pet.good_with_pets %}checked{% endif %} style="width: 18px; height: 18px; accent-color: var(--primary-orange);">
            <span>🐕 Friendly with Pets</span>
          </label>
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
          <label for="medical_notes">Veterinary Notes</label>
          <textarea id="medical_notes" name="medical_notes" class="form-control" rows="2">{{ pet.medical_notes or '' }}</textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 14px;">
          <a href="{{ url_for('shelter_dashboard') }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary btn-lg">
            💾 Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
